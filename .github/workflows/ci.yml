name: CI
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # This repository is public: CI runs on standard GitHub-hosted runners only.
  # A self-hosted runner would execute a fork's pull request on its own
  # machine. scripts/check-runner-labels.sh keeps it that way.
  runner-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-runner-labels.sh --self-test
      - run: bash scripts/check-runner-labels.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Left off when the jobs moved to hosted runners, to keep that
          # change to the runner only. Turning it on is a speed-up, not a fix.
          cache: false
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          # Same as cache: false above.
          skip-cache: true
          # Pinned. Unpinned, the action resolved a linter built with an
          # older Go than go.mod targets; it refused to load (exit 3) and
          # every downstream job reported "skipped", which reads as green.
          version: v2.13.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Left off when the jobs moved to hosted runners, to keep that
          # change to the runner only. Turning it on is a speed-up, not a fix.
          cache: false
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Check coverage
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          if [ "$(echo "$total < 70" | bc)" -eq 1 ]; then
            echo "::warning::Coverage ${total}% is below 70% threshold"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Left off when the jobs moved to hosted runners, to keep that
          # change to the runner only. Turning it on is a speed-up, not a fix.
          cache: false
      - name: Build binaries
        run: |
          go build -ldflags "-s -w" -o engram-server ./cmd/engramd/
          go build -ldflags "-s -w" -o engram-cli ./cmd/engramcli/

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Left off when the jobs moved to hosted runners, to keep that
          # change to the runner only. Turning it on is a speed-up, not a fix.
          cache: false
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet ./...
        continue-on-error: true
