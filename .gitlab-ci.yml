# GitLab CI for nfsarch33/engram
#
# Mirrors .github/workflows/ci.yml (3 jobs: lint, test, build-image)
# Stages here are renamed to match the sentrux GitLab convention used
# by helixon-platform's .gitlab-ci.yml (also in this arc):
#   1. lint       — vet, golangci-lint, govulncheck
#   2. test       — go test + goleak check
#   3. publish    — podman build, push, sign

stages:
  - lint
  - test
  - publish

variables:
  GO_VERSION: "1.23.4"
  REGISTRY: "ghcr.io/helixon"
  IMAGE_NAME: "engramd"
  CACHE_DIR: "$CI_PROJECT_DIR/.cache"

default:
  tags:
    - helixon
    - self-hosted
  before_script:
    - go version
    - podman --version

# ─────────────────────────────────────────────────────────────
# Stage 1: lint
# ─────────────────────────────────────────────────────────────
golangci-lint:
  stage: lint
  image:
    name: docker.io/golangci/golangci-lint:v1.62.2
    entrypoint: [""]
  script:
    - golangci-lint run --timeout=5m ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

vet:
  stage: lint
  image: golang:$GO_VERSION
  script:
    - go vet ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

govulncheck:
  stage: lint
  image: golang:$GO_VERSION-alpine
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./...
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────────────────────────────────────────────────────────
# Stage 2: test
# ─────────────────────────────────────────────────────────────
unit-tests:
  stage: test
  image: golang:$GO_VERSION
  script:
    - go test -race -cover -coverprofile=coverage.txt -count=1 ./...
    - go tool cover -func=coverage.txt | grep total
  coverage: '/^total:\s+\(statements\)?\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.txt
    expire_in: 30 days

goleak:
  stage: test
  image: golang:$GO VERSION
  script:
    - go test -run TestMainNoGoroutineLeak ./cmd/engramd/...
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# q11-2 — Ginkgo integration sweep (L0 rule 42)
# Mirrors the canonical job from sprintboard-mcp/.gitlab-ci.yml.
# Requires: ginkgo + gomega go.mod entries; one tagged *_ginkgo_test.go
# suite per package. The cache.Contains RED→GREEN spec is the seed;
# additional specs land in q11-3..q11-5.
integration:ginkgo:
  stage: test
  image: golang:$GO_VERSION
  tags:
    - helixon
    - self-hosted
  script:
    - go install github.com/onsi/ginkgo/v2/ginkgo@latest
    - ginkgo -r --tags=integration --trace --cover --coverprofile=integration.coverprofile
    - go tool cover -func=integration.coverprofile | tee coverage.txt
    - go test -race -tags=integration -count=1 ./...
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: integration.coverprofile
    paths:
      - integration.coverprofile
      - coverage.txt
    expire_in: 7 days
  coverage: '/total:\\\\s+\\\\(statements\\\\)\\\\s+(\\\\d+\\\\.\\\\d+)%/'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'
  needs: []

# ─────────────────────────────────────────────────────────────
# Stage 3: publish
# ─────────────────────────────────────────────────────────────
build-and-push-engramd:
  stage: publish
  image:
    name: quay.io/podman/stable:v4.9.3
    entrypoint: [""]
  script:
    - podman build -t $REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA
        -f Containerfile.helixon .
    - podman tag  $REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA
        $REGISTRY/$IMAGE_NAME:dev
    # Push: ghcr.io OR localhost:5000 depending on REGISTRY_OVERRIDE
    - |
      if [ "$REGISTRY_OVERRIDE" = "localhost:5000" ]; then
        podman push --tls-verify=false $REGISTRY/$IMAGE_NAME:dev localhost:5000/$IMAGE_NAME:dev
      else
        echo "$GHCR_PASSWORD" | podman login ghcr.io -u "$GHCR_USER" --password-stdin
        podman push $REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA
        podman push $REGISTRY/$IMAGE_NAME:dev
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
