---
apiVersion: v1
kind: Namespace
metadata:
  name: embed
  labels:
    app.kubernetes.io/part-of: helixon-platform
    owner: argo-cd
    sprint: v14885
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: engram-embedder-config
  namespace: embed
  labels:
    app: engram-embedder
    app.kubernetes.io/part-of: helixon-platform
data:
  owner: argo-cd
  sprint: v14885
  model: "nomic-embed-text:v1.5"
  listen_addr: "0.0.0.0:11434"
---
apiVersion: v1
kind: Service
metadata:
  name: engram-embedder
  namespace: embed
  labels:
    app: engram-embedder
    app.kubernetes.io/part-of: helixon-platform
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 11434
    targetPort: 11434
    protocol: TCP
  selector:
    app: engram-embedder
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engram-embedder
  namespace: embed
  labels:
    app: engram-embedder
    app.kubernetes.io/part-of: helixon-platform
    sprint: v14885
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engram-embedder
  template:
    metadata:
      labels:
        app: engram-embedder
        app.kubernetes.io/part-of: helixon-platform
    spec:
      # GPU not required for ollama embedding (CPU-only embed)
      containers:
      - name: engram-embedder
        image: ghcr.io/helixon/engram-embedder:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_HOST
          valueFrom:
            configMapKeyRef:
              name: engram-embedder-config
              key: listen_addr
        ports:
        - containerPort: 11434
          name: http
        livenessProbe:
          httpGet:
            path: /
            port: 11434
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
        readinessProbe:
          exec:
            command:
              - /usr/bin/wget
              - --quiet
              - --spider
              - --tries=1
              - http://localhost:11434/api/tags
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            # Embed inference uses CPU + RAM; the model is ~274MB
            cpu: 2000m
            memory: 4Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - mountPath: /tmp
          name: tmpfs
      volumes:
      - name: tmpfs
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
